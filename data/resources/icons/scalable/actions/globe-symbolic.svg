<?xml version="1.0" encoding="UTF-8"?>
<!-- Fill-only on purpose: GTK recolors symbolic icons by forcing
     `rect, circle, path { fill: <color> !important }` onto the SVG, which
     overrides fill="none" and ignores stroke entirely. A stroked drawing
     floods into a solid blob here, so every line is an explicit outline. -->
